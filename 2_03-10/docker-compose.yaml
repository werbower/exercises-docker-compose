services:
  backend:
    image: werbower/backend-service
    environment:
      REDIS_HOST: redis
    container_name: backend
    ports:
      - 8080:8080
    depends_on:
      - redis
    restart: unless-stopped
    
  redis:
    container_name: redis
    image: redis:alpine
    restart: unless-stopped
    
  frontend:
    image: werbower/frontend-service
    container_name: frontend
    ports:
      - 5001:5001